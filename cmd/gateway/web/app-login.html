<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · {{.Title}}</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/{{.App}}/assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/{{.App}}/manifest.webmanifest">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login">
<main class="login-card">
  <div class="login-head">
    <img src="/{{.App}}/assets/icon.svg" alt="" width="44" height="44">
    <div><h1>{{.Title}}</h1><p>Entra con tu usuario y contraseña.</p></div>
  </div>
  {{with .Error}}<p class="alert" role="alert">{{.}}</p>{{end}}
  <form method="post" action="/{{.App}}/_login" class="form">
    <input type="hidden" name="next" value="{{.Next}}">
    <label class="field"><span class="field-label">Usuario</span>
      <input name="username" value="{{.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label class="field"><span class="field-label">Contraseña</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="primary">Entrar</button>
  </form>
  <p class="hint">La sesión se mantiene en este dispositivo mientras uses la app. ¿Sin cuenta o sin contraseña? Pídesela al administrador.</p>
</main>
</body>
</html>
