<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · homeserver</title>
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login">
<main class="login-card">
  <div class="brand"><img src="/static/icon.svg" alt="" width="40" height="40"><span>homeserver</span></div>
  {{if .NoTOTP}}<p class="alert">El segundo factor no está configurado. Ejecuta <code>gateway totp</code> en el servidor.</p>{{end}}
  {{with .Error}}<p class="alert" role="alert">{{.}}</p>{{end}}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Contraseña
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <label>Código de verificación
      <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" required placeholder="123456">
    </label>
    <button class="primary">Entrar</button>
  </form>
  <p class="hint">¿No tienes la app de códigos? Usa un código de recuperación (<code>xxxx-xxxx</code>).</p>
</main>
</body>
</html>
