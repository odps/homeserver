{{define "head"}}<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<title>{{with .Title}}{{.}} · {{end}}Papeles</title>
<link rel="stylesheet" href="{{.Base}}/static/app.css">
<link rel="icon" href="{{.Base}}/static/icon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="{{.Base}}/" aria-label="Papeles, inicio"><span class="mark" aria-hidden="true"></span>Papeles</a>
    <a class="btn primary small add" href="{{.Base}}/doc/nuevo"><span aria-hidden="true">+</span> Añadir</a>
  </div>
</header>
<main id="contenido">
{{with .Flash}}<p class="toast" role="status">{{.}}</p>{{end}}
{{with .Error}}<p class="toast error" role="alert">{{.}}</p>{{end}}
{{end}}

{{define "foot"}}
</main>
<footer class="foot"><p>Tus papeles, cifrados en tu servidor.</p><p class="ver">{{.Version}}</p></footer>
</body>
</html>
{{end}}
